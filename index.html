<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CellPang</title>
  <style>
    /* Centers everything on the screen nicely */
    body {
      background-color: #1e1e2e; /* A slightly richer, modern dark tone */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Turns the raw link into a clean, clickable button */
    a {
      font-size: 28px;
      color: #89b4fa; /* A vibrant pastel blue */
      text-decoration: none;
      font-weight: 600;
      border: 2px solid #89b4fa;
      padding: 14px 28px;
      border-radius: 12px;
      transition: all 0.25s ease-in-out;
    }

    /* Smooth hover effect */
    a:hover {
      background-color: #89b4fa;
      color: #1e1e2e;
      box-shadow: 0 8px 24px rgba(137, 180, 250, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <a href="https://skxdhi.github.io/CellPang">CellPang</a>
</body>
</html>
